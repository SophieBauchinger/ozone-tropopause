[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ozone-tropopause"
version = "1.0.0"
description = "Ozone-based climatological tropopause-relative potential temperature coordinate"
dependencies = [
    "numpy",
    "netcdf4",
    "pandas",
    "matplotlib",
    "xarray",
    ]
authors = [{ name="'Sophie Bauchinger'", email="bauchinger@iau.uni-frankfurt.de" }]
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["o3_tropopause"]
